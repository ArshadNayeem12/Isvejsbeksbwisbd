
name: CodeForge Android APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify project files
        shell: bash
        run: |
          if [ ! -f package.json ]; then
            echo "::error::package.json not found in repository root."
            exit 1
          fi
          echo "Project package.json found."
          cat package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Ensure TypeScript is available
        run: npm install --no-save --no-package-lock typescript@^5

      - name: Verify build script
        shell: bash
        run: |
          node -e "const p=require('./package.json'); if(!p.scripts || !p.scripts.build) { console.error('Missing scripts.build in package.json'); process.exit(1); } console.log('Build script:', p.scripts.build)"

      - name: Build web application
        run: npm run build

      - name: Verify Capacitor configuration
        shell: bash
        run: |
          if [ ! -f capacitor.config.ts ] && \
             [ ! -f capacitor.config.json ] && \
             [ ! -f capacitor.config.js ] && \
             [ ! -f capacitor.config.mjs ]; then
            echo "::error::Capacitor config not found."
            exit 1
          fi

      - name: Prepare Android project
        shell: bash
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          if [ ! -f android/gradlew ]; then
            echo "::error::Android Gradle wrapper not found."
            exit 1
          fi
          chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeForge-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
