
name: CodeForge Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeforge-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ANDROID_HOME: ${{ runner.temp }}/android-sdk
      ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        shell: bash
        run: |
          set -e
          test -f package.json || {
            echo "::error::package.json missing from repository root"
            exit 1
          }
          cat package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Download Android command-line tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y unzip curl

          mkdir -p "$ANDROID_HOME/cmdline-tools"

          curl -fL \
            https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip \
            -o "$RUNNER_TEMP/android-tools.zip"

          mkdir -p "$RUNNER_TEMP/android-tools"
          unzip -q "$RUNNER_TEMP/android-tools.zip" \
            -d "$RUNNER_TEMP/android-tools"

          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"

          cp -a "$RUNNER_TEMP/android-tools/cmdline-tools/." \
            "$ANDROID_HOME/cmdline-tools/latest/"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Ensure TypeScript dependency
        run: npm install --no-save --no-package-lock typescript@^5

      - name: Validate build script
        shell: bash
        run: |
          node -e "
            const p = require('./package.json');
            if (!p.scripts || !p.scripts.build) {
              console.error('Missing scripts.build in package.json');
              process.exit(1);
            }
          "

      - name: Build web application
        run: npm run build

      - name: Verify Capacitor configuration
        shell: bash
        run: |
          if [ ! -f capacitor.config.ts ] && \
             [ ! -f capacitor.config.json ] && \
             [ ! -f capacitor.config.js ] && \
             [ ! -f capacitor.config.mjs ]; then
            echo "::error::Capacitor configuration not found"
            exit 1
          fi

      - name: Prepare Capacitor Android
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          test -f android/gradlew || {
            echo "::error::android/gradlew not found"
            exit 1
          }

          chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK exists
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK" || {
            echo "::error::APK was not generated"
            exit 1
          }

          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeForge-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
